[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["sea-orm-migration/cli", "dep:tokio"]

[dependencies]
tokio = { version = "1.48", optional = true, features = ["macros", "rt-multi-thread"] }

[dependencies.sea-orm-migration]
version = "1.1.0"
default-features = false
features = [
  "runtime-tokio",
  "sqlx-sqlite",
]
